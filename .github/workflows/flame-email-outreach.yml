name: WEAVE Flame Event Email Outreach

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    env:
      FLAME_EMAIL_URL: ${{ vars.WEAVE_FLAME_EMAIL_URL || 'https://weavingsystem.online/api/cron/flame-email-outreach' }}
    steps:
      - name: Request short-lived WEAVE scheduler identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weave-scheduler")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Run Flame Event email movement
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            "${FLAME_EMAIL_URL}"
