name: WEAVE Security Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave_security_qa
          POSTGRES_PASSWORD: test_only_not_production
          POSTGRES_DB: weave_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block known high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Account and authorization security regressions
        run: |
          node --import tsx --test tests/flame-institutional-intelligence.test.ts
          node tests/security-boundaries.cjs
          node tests/divine-shield-session-continuity.cjs
          node tests/password-hash-login-regression.cjs
          node tests/host-powershell-security-regression.cjs
          node tests/core-hardening-regression.cjs
          node tests/communication-security.cjs
          node tests/recovery-desk.cjs
      - name: PostgreSQL concurrency and replay protections
        env:
          WEAVE_SECURITY_TEST_DATABASE_URL: postgres://weave_security_qa:test_only_not_production@127.0.0.1:5432/weave_security_test
        run: node tests/security-postgres.cjs
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
