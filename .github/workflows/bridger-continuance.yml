name: WEAVE Bridger Continuance Renewal

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      CONTINUANCE_URL: ${{ vars.WEAVE_CONTINUANCE_URL || 'https://weavingsystem.online/api/cron/subscription-check' }}
    steps:
      - name: Request short-lived WEAVE scheduler identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weave-scheduler")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Renew due Bridger Continuance
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --request GET             --header "Authorization: Bearer ${{ steps.oidc.outputs.token }}"             "${CONTINUANCE_URL}"
