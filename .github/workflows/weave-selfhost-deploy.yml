name: WEAVE Self-Host Manual Recovery Deploy

# Production is not automatically promoted merely because a commit passes CI.
# Administration's Release Workshop is primary; this privileged manual recovery
# path preserves independent recovery if the WEAVE website is unavailable.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character commit SHA at current verified main'
        required: true
        type: string

concurrency:
  group: weave-selfhost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Locate canonical WEAVE server checkout
        id: locate
        shell: bash
        env:
          CONFIGURED_ROOT: ${{ vars.WEAVE_SERVER_REPO }}
        run: |
          set -euo pipefail
          candidates=()
          if [ -n "${CONFIGURED_ROOT:-}" ]; then candidates+=("$CONFIGURED_ROOT"); fi
          candidates+=("$HOME/system-bridge-frontend" "/opt/weave/system-bridge-frontend" "/srv/weave/system-bridge-frontend")
          for root in "${candidates[@]}"; do
            if [ -d "$root/.git" ] && [ -f "$root/docker-compose.selfhost.yml" ]; then
              echo "root=$root" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "WEAVE host checkout missing" >&2
          exit 1

      - name: Verify selected release against successful Production Check
        shell: bash
        env:
          WEAVE_ROOT: ${{ steps.locate.outputs.root }}
          VERIFIED_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WEAVE_ROOT"
          case "$(git remote get-url origin)" in
            *github.com/ecezzstarr/system-bridge-frontend.git|*github.com/ecezzstarr/system-bridge-frontend) ;;
            *) echo "Canonical origin required" >&2; exit 1 ;;
          esac
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Exact SHA required" >&2; exit 1
          fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_SHA" || {
            echo "Release no longer equals current canonical main" >&2; exit 1;
          }
          curl -fsS --max-time 25 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ecezzstarr/system-bridge-frontend/actions/workflows/production-check.yml/runs?head_sha=$VERIFIED_SHA&branch=main&per_page=30" \
            | python3 -c '
          import json,sys,os
          sha=os.environ["VERIFIED_SHA"]
          data=json.load(sys.stdin)
          assert any(r.get("head_sha")==sha and r.get("head_branch")=="main" and r.get("conclusion")=="success"
            for r in data.get("workflow_runs",[])), "Successful Production Check required"
          '

      - name: Deploy verified canonical main
        shell: bash
        env:
          WEAVE_ROOT: ${{ steps.locate.outputs.root }}
          VERIFIED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          cd "$WEAVE_ROOT"
          export WEAVE_DEPLOY_TARGET_SHA="$VERIFIED_SHA"
          bash selfhost/deploy-production.sh

      - name: Return current host release identity
        if: always()
        shell: bash
        env:
          WEAVE_ROOT: ${{ steps.locate.outputs.root }}
        run: |
          if [ -n "${WEAVE_ROOT:-}" ] && [ -d "$WEAVE_ROOT/.git" ]; then
            cd "$WEAVE_ROOT"
            docker compose -f docker-compose.selfhost.yml ps || true
            curl -fsS --max-time 15 http://127.0.0.1:3000/api/health || true
          fi
