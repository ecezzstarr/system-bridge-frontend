name: Install Approved Ember Poster
on:
  push:
    branches:
      - feature/ember-approved-original-poster-20261020
    paths:
      - .github/workflows/ember-approved-poster-ingest.yml
permissions:
  contents: write
jobs:
  approved-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve exact user-approved original Ember artwork
        env:
          WEAVE_EMBER_IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5ebfca46-14e3-4798-ba5a-918cc1a931bf.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjkyZmI1OWY5NTc3Nzc5NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjY4MTI0N30.ihNLn-sF6r4Q8QjR9DYiVw-YaqFz6SOdSAGtDqW8_7Q'
        run: |
          mkdir -p public/weave-food
          curl --fail --location --silent --show-error --retry 3 "$WEAVE_EMBER_IMAGE_URL" -o public/weave-food/ember.jpg
      - name: Verify exact original uploaded bytes
        run: |
          echo 'f5ae2082c508ce3d3a6a3886587a34f792cdc66b1df605e52217345491c28d0a  public/weave-food/ember.jpg' | sha256sum --check
          file --mime-type public/weave-food/ember.jpg | grep -q image/jpeg
      - name: Commit verified original to WEAVE app
        run: |
          git config user.name "weave-asset-bot"
          git config user.email "weave-asset-bot@users.noreply.github.com"
          git add public/weave-food/ember.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: install exact approved Ember Small/Large poster [skip ci]"
          git push origin HEAD:feature/ember-approved-original-poster-20261020
