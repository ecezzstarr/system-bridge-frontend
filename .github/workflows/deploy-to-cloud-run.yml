name: Deploy to Google Cloud Run (manual only)

# Deployment is intentionally NOT automatic.
# Production deployment is performed from Cloud Shell using scripts/deploy-cloud.sh
# after the application build and Cloud Run preflight checks pass.

on:
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE_NAME: system-bridge-frontend

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Automatic GitHub deployment is disabled."
          echo "Use scripts/deploy-cloud.sh from Google Cloud Shell after verification."
          exit 1
