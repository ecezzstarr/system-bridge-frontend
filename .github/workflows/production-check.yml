name: Production Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'reconcile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      system-switch-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave_qa
          POSTGRES_PASSWORD: weave_qa_only
          POSTGRES_DB: weave_switch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave_qa -d weave_switch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: File Folder world runtime regression
        run: node tests/file-folder-world-runtime-regression.cjs

      - name: Shared System Switch protocol and PostgreSQL multiplayer
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: |
          node tests/system-switch-multiplayer-regression.cjs
          node tests/mandate-guidance-staff-regression.cjs
          node tests/system-switch-multiplayer-postgres.cjs
          node tests/mandate-guidance-postgres.cjs
          node tests/today-food-postgres.cjs

      - name: Core recent-feature regression
        run: node tests/recent-features.cjs

      - name: Agent Creative Studio fee and image regressions
        run: node tests/agent-creative-studio-regression.cjs

      - name: Smart WEAVE loading guidance regression
        run: node tests/weave-loading-guidance-regression.cjs

      - name: Bridge of Radiance live loader regression
        run: node tests/weave-live-role-loader-regression.cjs

      - name: WEAVE loader visual stability regression
        run: node tests/weave-loader-visual-stability.cjs

      - name: Burning River and System Switch living-world continuity
        run: node tests/burning-river-system-switch-continuity.cjs

      - name: WEAVE food regressions
        run: |
          node tests/admin-order-notification-coverage.cjs
          node tests/carrier-food-payment-regression.cjs
          node tests/electrolyte-independent-home-regression.cjs
          node tests/ember-food-flow-regression.cjs
          node tests/agent-outlet-price-policy-regression.cjs
          node tests/agent-outlet-training-availability-regression.cjs
          node tests/agent-work-cakes-regression.cjs
          node tests/food-preparation-manager-payment-routing-regression.cjs
          node tests/food-forensic-economics.cjs
          node tests/weave-family-food-store-regression.cjs
          node tests/farm-to-family-lifestyle-regression.cjs
          node tests/carrier-farm-door-regression.cjs
          node tests/carrier-burning-river-crossing-regression.cjs
          node tests/flame-real-food-current-regression.cjs
          node tests/weave-food-economics-escrow-regression.cjs
          node tests/weave-food-pages-info-regression.cjs

      - name: Remaining regression checks
        run: |
          node tests/bridger-bridge-radiance-purchase-regression.cjs
          node tests/selfhost-deployment-regression.cjs
          node tests/prospect-whatsapp-handoff-regression.cjs
          node tests/bridger-whatsapp-replacement-limit.cjs
          node tests/file-folder-sales-manager-regression.cjs
          node tests/public-flame-movement-regression.cjs
          node tests/carrier-ace-regression.cjs
          node tests/lifestyle-position-access-regression.cjs
          node tests/agentic-bridger-regression.cjs
          node tests/file-folder-customer-door-purchase-regression.cjs
          node tests/system-switch-file-folder-boundary-regression.cjs
          node tests/client-hosted-avatar-world-regression.cjs
          node tests/file-folder-pricing-contract-regression.cjs
          node tests/legion-commerce-regression.cjs
          node tests/legion-lifestyle-employment-regression.cjs
          node tests/distribution-studio-regression.cjs
          node tests/bridger-subscribe-all-regression.cjs
          node tests/referral-core-regression.cjs
          node tests/manager-employment-regression.cjs
          node tests/distribution-assistant-managers-regression.cjs
          node tests/distribution-team-compensation-regression.cjs
          node tests/system-store-regression.cjs
          node tests/public-app-download-regression.cjs
          node tests/bridger-registration-durable-regression.cjs
          node tests/password-hash-login-regression.cjs
          node tests/core-hardening-regression.cjs
          node tests/commerce-ledger-regression.cjs
          node tests/email-mailbox-regression.cjs
          node tests/outreach-transport-behavior.cjs
          node tests/outreach-delivery-behavior.cjs
          node tests/video-ad-workshop.cjs
          node tests/wiring.cjs
          node tests/environment-grade.cjs
          node tests/flame-event-open-world-regression.cjs
          node tests/adaptive-runtime.cjs
          node tests/communication-security.cjs

      - name: Enterprise and Flame Coin purchase regressions
        run: |
          node tests/enterprise-legions-notebook.cjs
          node tests/client-lord-lady-subscription-regression.cjs
          node tests/flame-coin-prospect-purchases.cjs
          node tests/flame-coin-proof-route-regression.cjs
          node tests/customer-door-payment-privacy.cjs
          node tests/living-presence-renderer.cjs
          node tests/formation-foundation.cjs

      - name: Flame Coin payments PostgreSQL settlement
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: node tests/flame-coin-purchases-postgres.cjs

      - name: Customer Door maturity PostgreSQL regression
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: node tests/file-folder-customer-door-maturity-postgres.cjs

      - name: Legion positions PostgreSQL release regression
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: node tests/legion-position-release-postgres.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Container build
        run: docker build --progress=plain -t weave-production-check .

