name: Production Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression checks
        run: |
          node tests/recent-features.cjs
          node tests/file-folder-sales-manager-regression.cjs
          node tests/public-flame-movement-regression.cjs
          node tests/core-hardening-regression.cjs
          node tests/wiring.cjs
          node tests/environment-grade.cjs
          node tests/adaptive-runtime.cjs
          node tests/communication-security.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Container build
        run: docker build --progress=plain -t weave-production-check .
