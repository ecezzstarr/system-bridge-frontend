name: Production Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'reconcile/**'
      - 'integration/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      system-switch-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave_qa
          POSTGRES_PASSWORD: weave_qa_only
          POSTGRES_DB: weave_switch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave_qa -d weave_switch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: File Folder world runtime regression
        run: |
          node tests/file-folder-world-runtime-regression.cjs
          node tests/file-folder-environment-fidelity.cjs

      - name: Shared System Switch protocol and PostgreSQL multiplayer
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: |
          node tests/system-switch-multiplayer-regression.cjs
          node tests/mandate-guidance-staff-regression.cjs
          node tests/system-switch-multiplayer-postgres.cjs
          node tests/mandate-guidance-postgres.cjs
          node tests/today-food-postgres.cjs
          node tests/phone-push-postgres.cjs

      - name: Core recent-feature regression
        run: node tests/recent-features.cjs

      - name: Agent and Bridger department entry pricing regression
        run: |
          node tests/department-entry-role-pricing-regression.cjs
          node tests/system-switch-currency-display.cjs
          npx tsx --test tests/saturday-free-entry.test.ts

      - name: Administrations company movement and regional System Switch contracts
        run: |
          node tests/admin-company-movement-regression.cjs
          node tests/regional-manager-daily-workflow-regression.cjs
          node tests/regional-manager-work-support-integrity.cjs
          node tests/regional-system-switch-gate-regression.cjs
          node tests/burning-river-company-time-continuity.cjs

      - name: Agent Creative Studio fee and image regressions
        run: |
          node tests/agent-creative-studio-regression.cjs
          node tests/image-workshop.cjs
          node tests/echo-immediate-regression.cjs
          node tests/one-nigerian-scroll-regression.cjs
          node tests/bridge-ai-shared-file-folder-assistance.cjs
          node tests/admin-loader-workshop-contract.cjs

      - name: Image House paid commercial licenses and company revenue PostgreSQL check
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: npx tsx tests/image-sample-postgres.test.ts

      - name: Provider-free Image House and protected historical image gallery
        run: node tests/advanced-image-workshop.cjs

      - name: Smart WEAVE loading guidance regression
        run: |
          node tests/weave-loading-guidance-regression.cjs
          node tests/whole-weave-wording-regression.cjs

      - name: Offline branding business · real templates, adverts and role workflows
        run: node tests/branding-business-regression.cjs

      - name: Company branding launch PostgreSQL accounting and deduplication
        env:
          WEAVE_SYSTEM_SWITCH_TEST_DATABASE_URL: postgres://weave_qa:weave_qa_only@127.0.0.1:5432/weave_switch_test
        run: npx tsx tests/branding-business-postgres.test.ts

      - name: File Folder careers, real-time builds and optional Boost Bay purchases
        run: node tests/file-folder-career-and-boost-bay-regression.cjs

      - name: Bridger outreach and Agent daily work integrity
        run: |
