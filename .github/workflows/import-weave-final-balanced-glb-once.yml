name: Import final balanced 3D Weave campus model once
on:
  push:
    branches: [feat/official-grounds-immersive-click-20261122]
    paths: ['.github/workflows/import-weave-final-balanced-glb-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace Company Grounds GLB revision four
        env:
          SIGNED_GLB_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/5e64782f-bb07-4cdc-8258-cea657f7d1cd/revisions/00000004-weave-campus-balanced-architectural-light-04/preview.glb?X-Amz-Expires=900&X-Amz-Date=20261122T045338Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20261122%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=388ea0bf7627718a3cd4c8b4ab5bc9697676ce4f89f18a2fbcafbcc8c2deaa21"
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 "$SIGNED_GLB_URL" -o public/models/weave-company-grounds.glb
          test "$(stat -c%s public/models/weave-company-grounds.glb)" -eq 2872500
          test "$(head -c 4 public/models/weave-company-grounds.glb)" = glTF
      - name: Commit final model
        run: |
          git config user.name 'Weave 3D final model'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/weave-company-grounds.glb
          git diff --cached --quiet && exit 0
          git commit -m 'Commit balanced and animated Company Grounds GLB revision four'
          git push origin HEAD:feat/official-grounds-immersive-click-20261122
