name: WEAVE Prospect Market Auto-Replenishment

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  replenish:
    runs-on: ubuntu-latest
    env:
      PROSPECT_MARKET_URL: ${{ vars.WEAVE_PROSPECT_MARKET_URL || 'https://weavingsystem.online/api/cron/prospect-market' }}
    steps:
      - name: Request signed WEAVE scheduler token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=weave-scheduler")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Replenish below 120 published candidates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            "${PROSPECT_MARKET_URL}"
