name: WEAVE Verified Continuity Review

# The company currently uses Oracle as its public host. Main-branch CI
# completion cannot request a production deployment on that host.
# Administrations alone initiates verified host releases through the
# unchanged /admin/release-workshop. This workflow is read-only.
# Future Weave-owned autonomous host updates require a separate
# intentionally reviewed and authorized host-specific release protocol.
on:
  workflow_run:
    workflows: ["Production Check"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: weave-reviewed-continuity
  cancel-in-progress: false

jobs:
  review-verified-main:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm exact source revision without executing a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$REPO" = "ecezzstarr/system-bridge-frontend"
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_MAIN="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_MAIN" != "$VERIFIED_SHA" ]; then
            echo "A newer main exists; this is not a production candidate."
            exit 0
          fi
          {
            echo "### WEAVE verified source candidate"
            echo "Revision: $VERIFIED_SHA"
            echo "Oracle production host: unchanged."
            echo "Reviewed code requires an explicit authorized request in Administrations Release Workshop."
            echo "No host release, DNS switch, database migration or Oracle command was dispatched."
          } >> "$GITHUB_STEP_SUMMARY"
