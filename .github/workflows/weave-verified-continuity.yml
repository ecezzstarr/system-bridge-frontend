name: WEAVE Verified Continuity Release

# Opt-in, unattended promotion of reviewed main commits. Production cannot be
# reached by a workshop draft or a pull_request workflow success.
# A one-time repository variable is required: WEAVE_AUTONOMOUS_RELEASES=enabled.
on:
  workflow_run:
    workflows: ["Production Check"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: weave-autonomous-release-dispatch
  cancel-in-progress: false

jobs:
  dispatch-verified-main:
    if: >-
      ${{ vars.WEAVE_AUTONOMOUS_RELEASES == 'enabled' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Revalidate immutable canonical main before sending to host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$REPO" = "ecezzstarr/system-bridge-frontend"
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_MAIN="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_MAIN" != "$VERIFIED_SHA" ]; then
            echo "A newer main exists; the corresponding CI event will handle it."
            exit 0
          fi
          echo "main_sha=$VERIFIED_SHA" >> "$GITHUB_ENV"

      - name: Dispatch the existing CI-verified host release and rollback path
        if: env.main_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ env.main_sha }}
        run: |
          set -euo pipefail
          # The existing self-hosted workflow rechecks origin/main and the
          # exact push-to-main Production Check before touching the server.
          # It shares the same production concurrency/lock and health rollback.
          gh api --method POST "repos/$REPO/actions/workflows/weave-selfhost-deploy.yml/dispatches" \
            -f ref=main -f "inputs[release_sha]=$VERIFIED_SHA"
          echo "Queued verified main $VERIFIED_SHA for independent host verification."
