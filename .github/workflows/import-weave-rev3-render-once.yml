name: Import verified final 3D campus render once
on:
  push:
    branches: [feat/official-grounds-immersive-click-20261122]
    paths: ['.github/workflows/import-weave-rev3-render-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Replace 3D preview with final rendered revision
        env:
          SIGNED_RENDER_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/5e64782f-bb07-4cdc-8258-cea657f7d1cd/queries/weave-campus-rev3-final-render-review/artifacts/08cbc3b07d4fd1e58577300efe1b62ee.png?X-Amz-Expires=900&X-Amz-Date=20261122T045058Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20261122%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=7fb941f8ff66b5d8bed474a19d4eccb36f9bebbffa8646355582ec6102e5c6c2"
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 "$SIGNED_RENDER_URL" -o public/images/weave-company-grounds-3d-preview.png
          test "$(stat -c%s public/images/weave-company-grounds-3d-preview.png)" -eq 511773
          test "$(head -c 8 public/images/weave-company-grounds-3d-preview.png | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
      - name: Commit final preview
        run: |
          git config user.name 'Weave 3D final preview'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/weave-company-grounds-3d-preview.png
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh 3D Company Grounds preview to refined model revision three'
          git push origin HEAD:feat/official-grounds-immersive-click-20261122
