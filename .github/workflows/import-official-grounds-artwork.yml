name: Import exact approved Company Grounds artwork
on:
  push:
    branches: [feat/official-grounds-immersive-click-20261122]
    paths: ['.github/workflows/import-official-grounds-artwork.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify approved image bytes
        env:
          APPROVED_IMAGE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3LoQppjO2FedlOI0UfRH3hpIE03/cd492df3-5897-4c72-b629-7c4b5edd5ef1.png
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 --connect-timeout 12 "$APPROVED_IMAGE_URL" --output public/images/weave-official-hybrid-home.jpg
          echo 'bbe2056bba2e56dc35479160d9aad03ad2527504a5dbafaf9c34f324167d082b  public/images/weave-official-hybrid-home.jpg' | sha256sum --check
      - name: Commit approved image only
        run: |
          git config user.name 'Weave artwork import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/weave-official-hybrid-home.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Import exact approved Weave homepage image'
          git push origin HEAD:feat/official-grounds-immersive-click-20261122
