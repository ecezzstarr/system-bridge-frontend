name: Weave Presentation Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/weave-*.ts'
      - 'lib/*workplace-catalog.ts'
      - 'public/fonts/**'
      - 'tests/weave-expression-browser.cjs'
      - 'tests/helpers/**'
      - '.github/workflows/weave-presentation-check.yml'
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      # ubuntu-latest includes browser system libraries; avoid apt mirror DNS as a release blocker.
      - run: npx playwright install chromium
      - run: npm run build
      - name: Render and verify phone, tablet and desktop
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/weave-presentation.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/weave-expression-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weave-presentation
          path: presentation-results
          retention-days: 14
