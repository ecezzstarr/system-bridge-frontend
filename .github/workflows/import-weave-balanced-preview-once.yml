name: Import balanced 3D campus visual check once
on:
  push:
    branches: [feat/official-grounds-immersive-click-20261122]
    paths: ['.github/workflows/import-weave-balanced-preview-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import original balanced scene render
        env:
          SIGNED_RENDER_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/5e64782f-bb07-4cdc-8258-cea657f7d1cd/queries/weave-campus-balanced-revision-4-render/artifacts/faad760e42695fa923dfd37843e113f1.png?X-Amz-Expires=900&X-Amz-Date=20261122T045307Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20261122%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=5ec43ed2cc321015800c0bb762aee253dea0349d23f51a5e9440a4169cc04cee"
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 "$SIGNED_RENDER_URL" -o public/images/weave-company-grounds-3d-preview.png
          test "$(stat -c%s public/images/weave-company-grounds-3d-preview.png)" -eq 468018
          test "$(head -c 8 public/images/weave-company-grounds-3d-preview.png | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
      - name: Commit final scene render
        run: |
          git config user.name 'Weave scene preview'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/weave-company-grounds-3d-preview.png
          git diff --cached --quiet && exit 0
          git commit -m 'Balance 3D Company Grounds rendered preview'
          git push origin HEAD:feat/official-grounds-immersive-click-20261122
