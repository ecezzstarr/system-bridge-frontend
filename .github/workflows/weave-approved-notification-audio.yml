name: Import Approved Weave Notification Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weave-approved-notification-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-approved-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved four-second recording
        env:
          APPROVED_AUDIO_URL: 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/60961412-b0a3-48b9-8fe7-5b5ca6425d18/WEAVE___Audible_Birds_over_Gentle_River___corrected_full_preview.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjIxMWI0NDI2NmFlZjM4MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mjc2MzIwMn0.6ZnXc14DYQIMsW6gsFMFgVJo_pD3Vl9grGjMEAFRK2M'
        run: |
          set -euo pipefail
          mkdir -p public/sounds
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 45 \
            "$APPROVED_AUDIO_URL" -o public/sounds/weave-river-birds.mp3
          python3 - <<'PY'
          from pathlib import Path
          source=Path('public/sounds/weave-river-birds.mp3')
          data=source.read_bytes()
          assert 3000 < len(data) < 2_000_000, 'unexpected file size'
          assert data[:3]==b'ID3' or (data[0]==0xff and (data[1]&0xe0)==0xe0), 'not an MP3'
          print('Approved audio bytes:',len(data))
          PY
      - name: Commit approved audio to WEAVE
        run: |
          set -euo pipefail
          git config user.name 'weave-media-bot'
          git config user.email 'weave-media-bot@users.noreply.github.com'
          git add public/sounds/weave-river-birds.mp3
          if git diff --cached --quiet; then
            echo 'Approved audio already present'
          else
            git commit -m 'Store approved Weave river and birds notification audio'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
