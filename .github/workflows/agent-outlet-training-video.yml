name: Verify WEAVE Agent-Only Training Media

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - private/agent-training/agent-outlet-training.mp4
      - app/api/agent/training/video/route.ts
      - components/agent/agent-outlet-training-video.tsx
      - app/(app)/agent/outlet-training/page.tsx
      - .github/workflows/agent-outlet-training-video.yml

permissions:
  contents: read

jobs:
  verify-agent-training:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved MP4 stays in the private media directory
        run: |
          test -s private/agent-training/agent-outlet-training.mp4
          test ! -f public/training/agent-outlet-training.mp4
          python3 - <<'PY'
          from pathlib import Path
          video=Path('private/agent-training/agent-outlet-training.mp4')
          raw=video.read_bytes()[:32]
          assert len(raw)>12 and raw[4:8]==b'ftyp', 'Expected a valid MP4 container'
          print('Protected Agent video asset present:',video.stat().st_size,'bytes')
          PY
      - name: Agent role and video regression
        run: node tests/agent-outlet-training-availability-regression.cjs
