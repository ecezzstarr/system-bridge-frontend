# Cloud Build configuration for automated deployment
# This file orchestrates the build and deployment process to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_COMMIT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'COMMIT_SHA=${_COMMIT_SHA}'
      - '--build-arg'
      - 'BUILD_TIMESTAMP=${_BUILD_TIMESTAMP}'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_COMMIT_SHA}'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy-cloud-run'
    args:
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'COMMIT_SHA=${_COMMIT_SHA},BUILD_TIMESTAMP=${_BUILD_TIMESTAMP}'
      - '--update-secrets'
      - 'GOOGLE_AI_KEY=google-ai-key:latest,DATABASE_URL=database-url:latest,EIGHT_INTERNAL_TOKEN=eight-internal-token:latest'
    waitFor: ['push-image']

  # Step 4: Verify deployment health
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'health-check'
    args:
      - 'run'
      - '--filename=.'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
    waitFor: ['deploy-cloud-run']

# Substitutions for environment-specific values
substitutions:
  _SERVICE_NAME: 'system-bridge-frontend'
  _REGION: 'us-central1'
  _COMMIT_SHA: '${COMMIT_SHA}'
  _BUILD_TIMESTAMP: '${BUILD_ID}'

# Image output
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_COMMIT_SHA}'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

# Timeout for the entire build process
timeout: 3600s

# Options for the build
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY