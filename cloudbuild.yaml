steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/system-bridge/frontend:$COMMIT_SHA', '.']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/system-bridge/frontend:$COMMIT_SHA'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
