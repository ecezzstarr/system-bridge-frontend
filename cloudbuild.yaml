steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/system-bridge-frontend', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/system-bridge-frontend']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'system-bridge-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/system-bridge-frontend'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION}'
      - '--set-env-vars'
      - 'NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_CONNECTION},CLOUD_SQL_DATABASE=${_DB_NAME},CLOUD_SQL_USER=${_DB_USER},CLOUD_SQL_PASSWORD=${_DB_PASSWORD},FLW_PUBLIC_KEY=${_FLW_PUBLIC_KEY},FLW_SECRET_KEY=${_FLW_SECRET_KEY},JWT_SECRET=${_JWT_SECRET}'

substitutions:
  _REGION: us-central1
  _CLOUD_SQL_CONNECTION: ''
  _DB_NAME: ''
  _DB_USER: ''
  _DB_PASSWORD: ''
  _FLW_PUBLIC_KEY: ''
  _FLW_SECRET_KEY: ''
  _JWT_SECRET: ''

images:
  - 'gcr.io/$PROJECT_ID/system-bridge-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
