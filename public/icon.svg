<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WEAVE of Presence</title>
  <desc id="desc">Official WEAVE of Presence app icon: interwoven blue and flame-red presence streams around a radiant center.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0d2341"/>
      <stop offset="55%" stop-color="#06111f"/>
      <stop offset="100%" stop-color="#02060d"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7fbff"/>
      <stop offset="18%" stop-color="#63e7ff"/>
      <stop offset="52%" stop-color="#1687ff"/>
      <stop offset="100%" stop-color="#1834d7"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7be"/>
      <stop offset="20%" stop-color="#ffd34f"/>
      <stop offset="52%" stop-color="#ff6a19"/>
      <stop offset="100%" stop-color="#d71935"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#bdefff"/>
      <stop offset="100%" stop-color="#d5b8ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48d9ff"/>
      <stop offset="48%" stop-color="#f7fbff"/>
      <stop offset="52%" stop-color="#ffd86a"/>
      <stop offset="100%" stop-color="#ff5b2e"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fff3b8"/>
      <stop offset="68%" stop-color="#79dfff" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#79dfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <circle cx="256" cy="246" r="167" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".78" filter="url(#soft)"/>
    <circle cx="256" cy="246" r="142" fill="none" stroke="#87dcff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M76 246H436" stroke="url(#ring)" stroke-width="3" opacity=".55"/>
    <path d="M256 66V430" stroke="url(#ring)" stroke-width="2" opacity=".18"/>

    <!-- blue Presence stream -->
    <path d="M246 432
             C171 379 151 323 184 269
             C208 230 244 216 229 177
             C214 138 177 123 180 78
             C139 113 121 161 136 205
             C151 248 183 270 172 311
             C160 356 179 400 246 432Z"
          fill="url(#blue)" filter="url(#glow)"/>
    <path d="M227 400
             C187 357 188 321 211 289
             C238 252 262 234 251 199
             C243 174 225 156 222 128
             C195 161 194 192 210 220
             C231 257 207 279 195 306
             C181 340 194 373 227 400Z"
          fill="#c9f7ff" opacity=".34"/>

    <!-- flame / movement stream -->
    <path d="M266 432
             C343 377 365 321 333 267
             C309 226 274 211 289 171
             C305 130 345 112 329 60
             C373 98 394 151 377 200
             C362 246 330 268 341 311
             C353 357 334 401 266 432Z"
          fill="url(#fire)" filter="url(#glow)"/>
    <path d="M288 399
             C329 355 327 321 302 287
             C276 251 251 232 262 197
             C270 170 289 152 291 122
             C320 156 321 189 304 219
             C283 256 307 279 319 307
             C334 341 321 374 288 399Z"
          fill="#fff4c6" opacity=".31"/>

    <!-- bridge ribbon -->
    <path d="M175 142
             C225 177 300 189 329 237
             C354 279 324 321 282 351
             C253 372 239 392 252 432
             C214 401 205 366 226 338
             C251 305 304 287 306 251
             C307 220 262 204 226 190
             C195 178 178 164 175 142Z"
          fill="url(#bridge)" filter="url(#soft)"/>
    <path d="M337 143
             C286 177 213 190 184 238
             C159 280 189 321 232 351
             C261 371 275 392 262 432
             C300 401 309 366 288 338
             C263 305 210 288 208 251
             C207 221 252 204 288 191
             C319 179 334 165 337 143Z"
          fill="url(#bridge)" opacity=".92" filter="url(#soft)"/>

    <!-- radiant presence -->
    <circle cx="256" cy="246" r="43" fill="url(#star)" filter="url(#glow)"/>
    <path d="M256 186L266 236L326 246L266 256L256 316L246 256L186 246L246 236Z"
          fill="#fff9df" filter="url(#glow)"/>
    <circle cx="256" cy="246" r="8" fill="#ffffff"/>

    <circle cx="90" cy="246" r="7" fill="#57dfff" filter="url(#soft)"/>
    <circle cx="422" cy="246" r="7" fill="#ff8252" filter="url(#soft)"/>

    <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".72"/>
  </g>
</svg>