    <path d="M-76-21L0 4 76-21 76-13 0 13-76-13Z" fill="#c8a05b" stroke="#fff0c3" stroke-width="1.5"/>
    <path d="M-60 38L0 57 59 38" fill="none" stroke="#ffe3a4" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="-70" cy="48" r="8" fill="#548b63"/><circle cx="-60" cy="43" r="8" fill="#7ba777"/>
    <circle cx="70" cy="48" r="8" fill="#548b63"/><circle cx="60" cy="43" r="8" fill="#7ba777"/>
  </g>
