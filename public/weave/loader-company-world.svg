    <path d="M-60-13L0 7 59-13M0 7V59" fill="none" stroke="#d2a554" stroke-width="2.7"/>
    <path d="M-41-7V46M-19 0V53M23 0V51M42-7V45" stroke="#f6e7b6" stroke-opacity=".9" stroke-width="3"/>
