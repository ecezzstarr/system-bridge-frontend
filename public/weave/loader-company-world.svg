<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">The Weave of Presence company world</title>
<desc id="desc">A central ivory File Folder connects six architectural working districts over a reflective blue world.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset=".6" stop-color="#d2e8fa"/><stop offset="1" stop-color="#9abfdd"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8e8f8"/><stop offset=".4" stop-color="#6ca9cb"/><stop offset="1" stop-color="#1a5d86"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4cb"/><stop offset=".4" stop-color="#daac57"/><stop offset=".72" stop-color="#956720"/><stop offset="1" stop-color="#f7e9aa"/></linearGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef9"/><stop offset=".55" stop-color="#eee8da"/><stop offset="1" stop-color="#c6c7bd"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9db" stop-opacity=".94"/><stop offset=".4" stop-color="#d7edfa" stop-opacity=".8"/><stop offset="1" stop-color="#6e9fbe" stop-opacity=".95"/></linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d0d4d7"/></linearGradient>
  <filter id="shadow" x="-30%" y="-70%" width="160%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="waves" width="42" height="24" patternUnits="userSpaceOnUse"><path d="M0 12Q11 8 21 12T42 12" fill="none" stroke="#e7f8ff" stroke-opacity=".13" stroke-width="1.6"/></pattern>
  <g id="pavilion">
