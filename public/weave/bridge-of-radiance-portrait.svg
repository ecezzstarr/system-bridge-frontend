<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Bridge of Radiance formed by the flowing rivers of water and fire">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#021331"/><stop offset=".29" stop-color="#0a4176"/><stop offset=".52" stop-color="#5785aa"/><stop offset=".66" stop-color="#f5be7c"/><stop offset="1" stop-color="#07172f"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#fff9cc"/><stop offset=".18" stop-color="#ffe8a4" stop-opacity=".9"/><stop offset=".49" stop-color="#ffca79" stop-opacity=".47"/><stop offset="1" stop-color="#ffdca3" stop-opacity="0"/></radialGradient>
 <linearGradient id="water" x2=".1" y2="1"><stop stop-color="#ebffff"/><stop offset=".18" stop-color="#59e6ff"/><stop offset=".56" stop-color="#00a6f6"/><stop offset="1" stop-color="#0057be"/></linearGradient>
 <linearGradient id="fire" x2=".1" y2="1"><stop stop-color="#fffdd8"/><stop offset=".22" stop-color="#ffe07e"/><stop offset=".52" stop-color="#ff993a"/><stop offset="1" stop-color="#ee4718"/></linearGradient>
 <linearGradient id="gold" x2=".1" y2="1"><stop stop-color="#fff3c1"/><stop offset=".35" stop-color="#eab36a"/><stop offset=".75" stop-color="#ab6a39"/><stop offset="1" stop-color="#593a3a"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#ffe9c4"/><stop offset=".4" stop-color="#a9a4a2"/><stop offset="1" stop-color="#36466b"/></linearGradient>
 <linearGradient id="ground" x2=".2" y2="1"><stop stop-color="#163659"/><stop offset=".52" stop-color="#063051"/><stop offset="1" stop-color="#030e26"/></linearGradient>
 <pattern id="ripple" width="86" height="27" patternUnits="userSpaceOnUse"><path d="M-8 12Q19 4 45 12T95 12M-12 25Q29 18 77 25" fill="none" stroke="#c9f5ff" stroke-opacity=".16" stroke-width="1.6"/></pattern>
 <style>
  .rflow{stroke-dasharray:16 24;animation:currents 23s linear infinite}
  .rflow.alt{animation-duration:29s;animation-direction:reverse}
  .stars{animation:glint 5s ease-in-out infinite alternate}
  @keyframes currents{to{stroke-dashoffset:-800}}
  @keyframes glint{to{opacity:.38}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
