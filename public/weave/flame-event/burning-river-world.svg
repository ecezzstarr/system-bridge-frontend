<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Burning River, a radiant world of flowing water and fire surrounding the System Switch crossing">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#142b52"/><stop offset=".32" stop-color="#446c92"/><stop offset=".59" stop-color="#e7bb80"/><stop offset=".79" stop-color="#d19b65"/><stop offset="1" stop-color="#101d38"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffdea"/><stop offset=".16" stop-color="#fff6c7" stop-opacity=".96"/><stop offset=".41" stop-color="#ffc979" stop-opacity=".75"/><stop offset="1" stop-color="#ffbf72" stop-opacity="0"/></radialGradient>
 <linearGradient id="mountain" x2="0" y2="1"><stop stop-color="#a6c2ce"/><stop offset=".5" stop-color="#5d7595"/><stop offset="1" stop-color="#2a395b"/></linearGradient>
 <linearGradient id="river" x2=".2" y2="1"><stop stop-color="#537a9c"/><stop offset=".24" stop-color="#1b527e"/><stop offset=".57" stop-color="#0b315c"/><stop offset="1" stop-color="#041e42"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff3bd"/><stop offset=".35" stop-color="#ffce74"/><stop offset=".72" stop-color="#d48c2a"/><stop offset="1" stop-color="#9b5b23"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#f5e6ce"/><stop offset=".35" stop-color="#c3b6a7"/><stop offset=".7" stop-color="#7b8194"/><stop offset="1" stop-color="#344769"/></linearGradient>
 <linearGradient id="fire" x2="0" y2="0" x1="1" y1="1"><stop stop-color="#fff5c3"/><stop offset=".3" stop-color="#ffc76a"/><stop offset=".7" stop-color="#ff913f"/><stop offset="1" stop-color="#ec5729"/></linearGradient>
 <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#ffcf7b" stop-opacity="0"/><stop offset=".17" stop-color="#ffb45c" stop-opacity=".87"/><stop offset=".55" stop-color="#fff3aa" stop-opacity=".95"/><stop offset=".9" stop-color="#f08e34" stop-opacity=".87"/><stop offset="1" stop-color="#ffcf7b" stop-opacity="0"/></linearGradient>
 <radialGradient id="mist"><stop stop-color="#fff6e0" stop-opacity=".67"/><stop offset="1" stop-color="#e0e7eb" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="19"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".012 .022" numOctaves="2" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
 <pattern id="ripples" width="108" height="34" patternUnits="userSpaceOnUse"><path d="M-4 10 Q22 1 53 10 T112 10 M-18 28 Q19 20 63 29 T118 27" fill="none" stroke="#dbeaf0" stroke-opacity=".17" stroke-width="1.4"/></pattern>
 <style>
 .flow-a{stroke-dasharray:19 26;animation:river-a 20s linear infinite}.flow-b{stroke-dasharray:32 24;animation:river-a 28s linear reverse infinite}.glimmer{animation:glimmer 5s ease-in-out infinite alternate}
 @keyframes river-a{to{stroke-dashoffset:-900}}@keyframes glimmer{to{opacity:.35;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
