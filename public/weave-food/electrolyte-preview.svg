    <text x="0" y="66" dominant-baseline="hanging" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900">ELECTROLYTE</text>
    <text x="2" y="158" dominant-baseline="hanging" fill="#d9f0df" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Fresh sliced food bowl</text>
