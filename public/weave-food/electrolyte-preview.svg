<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WEAVE Electrolyte Food Preview</title>
  <desc id="desc">A clear visual preview of the WEAVE Electrolyte sliced food bowl.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06160e"/>
      <stop offset="0.55" stop-color="#123f2a"/>
      <stop offset="1" stop-color="#61a64e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fff9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d7eee0" stop-opacity=".78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="52" fill="url(#bg)"/>
