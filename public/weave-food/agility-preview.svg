<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WEAVE Agility Food Preview</title>
  <desc id="desc">A clear visual preview of the WEAVE Agility morning food package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1608"/>
      <stop offset="0.55" stop-color="#8a3d0c"/>
      <stop offset="1" stop-color="#f3a72f"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e4"/>
      <stop offset="1" stop-color="#e7d5ac"/>
