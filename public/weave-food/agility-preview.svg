    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="52" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="170" fill="#ffd77c" opacity=".13"/>
  <circle cx="80" cy="725" r="210" fill="#210d03" opacity=".25"/>

