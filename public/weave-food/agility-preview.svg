    <text x="0" y="66" dominant-baseline="hanging" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900">AGILITY</text>
    <text x="2" y="166" dominant-baseline="hanging" fill="#ffe8bb" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Morning food package · prepared for movement</text>
