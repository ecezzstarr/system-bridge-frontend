# Optional, explicitly provisioned research worker; never exposes a public port.
services:
  flame-training:
    build:
      context: .
      dockerfile: flame-model/Dockerfile.training
    network_mode: "service:weave"
    depends_on:
      weave:
        condition: service_healthy
    restart: unless-stopped
    environment:
      WEAVE_FLAME_TRAINING_TOKEN: ${WEAVE_FLAME_TRAINING_TOKEN:?Set the private training token}
    volumes:
      - weave-one-private:/private/weave-one
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,json; r=urllib.request.Request('http://127.0.0.1:8766/status',headers={'Authorization':'Bearer '+os.environ['WEAVE_FLAME_TRAINING_TOKEN']}); assert json.load(urllib.request.urlopen(r,timeout=5))['ready'] is True"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 10s
    mem_limit: 2g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  weave-one-private:
