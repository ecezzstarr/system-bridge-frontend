substitutions:
  _REGION: us-central1
  _SERVICE: system-bridge-frontend
  _IMAGE_REPO: us-central1-docker.pkg.dev/$PROJECT_ID/system-bridge/frontend
  _CANDIDATE_TAG: weave-candidate

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build','-t','${_IMAGE_REPO}:$COMMIT_SHA','.']

  - name: gcr.io/cloud-builders/docker
    args: ['push','${_IMAGE_REPO}:$COMMIT_SHA']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_IMAGE_REPO}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--no-traffic'
      - '--tag=${_CANDIDATE_TAG}'
      - '--quiet'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe "${_SERVICE}" --region="${_REGION}" --format=json > /workspace/weave-service.json
        python3 - <<'PY'
        import json, urllib.request
        data=json.load(open('/workspace/weave-service.json'))
        traffic=data.get('status',{}).get('traffic',[])
        candidate=next((item for item in traffic if item.get('tag')=='weave-candidate'),None)
        assert candidate and candidate.get('url'), 'weave-candidate URL missing'
        url=candidate['url'].rstrip('/')
        with urllib.request.urlopen(url+'/api/health',timeout=60) as response:
            body=json.load(response)
            assert response.status==200 and body.get('status')=='healthy', body
        with urllib.request.urlopen(url+'/api/divine-shield/status',timeout=60) as response:
            body=json.load(response)
            assert response.status==200 and 'active' in body, body
        print('WEAVE candidate verified:',url)
        PY

images:
  - '${_IMAGE_REPO}:$COMMIT_SHA'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
