services:
  weave:
    image: weave-release:${WEAVE_RELEASE_SHA:-selfhost}
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    container_name: weave-app
    restart: unless-stopped
    env_file:
      - selfhost/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      WEAVE_MEDIA_ROOT: /var/lib/weave/media
      WEAVE_RELEASE_SHA: ${WEAVE_RELEASE_SHA:-selfhost}
      WEAVE_DEPLOYMENT_SERVER: ${WEAVE_DEPLOYMENT_SERVER:-weave-selfhost}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - weave-media:/var/lib/weave
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - weave-net

  caddy:
    image: caddy:2-alpine
    container_name: weave-edge
    restart: unless-stopped
    env_file:
      - selfhost/.env
    depends_on:
      weave:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - weave-caddy-data:/data
      - weave-caddy-config:/config
    networks:
      - weave-net

networks:
  weave-net:
    name: weave-net

volumes:
  weave-media:
    name: weave-media
  weave-caddy-data:
    name: weave-caddy-data
  weave-caddy-config:
    name: weave-caddy-config
